<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
  <title id="title">Target applications for wireless 180-degree servo position control</title>
  <desc id="desc">An MBD phone controls a wireless MCU and a positional servo. Six potential end products are a robotic gripper, camera pan mount, adjustable air vent, model vehicle steering, model railway turnout, and tabletop sorting gate. The slider commands any whole-degree angle from 0 to 180. These are integration ideas, not validated complete products.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b162b"/><stop offset="1" stop-color="#173553"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
  </defs>
  <rect width="1200" height="910" rx="26" fill="url(#bg)"/>
  <circle cx="1130" cy="50" r="180" fill="#38bdf8" opacity=".04"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="44" y="46" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="3">TARGET APPLICATIONS / POSITION CONTROL</text>
    <text x="44" y="98" fill="#f8fafc" font-size="38" font-weight="700">Put wireless motion into your next product.</text>
    <text x="44" y="134" fill="#cbd5e1" font-size="20">Aim a camera. Position a gripper. Adjust a vent. Command the angle from your phone.</text>
    <rect x="44" y="166" width="1112" height="104" rx="18" fill="#213b58"/>
    <g fill="#f8fafc" font-size="21" font-weight="600" text-anchor="middle">
      <text x="175" y="210">MBD app</text><text x="580" y="210">Wireless MCU</text><text x="1000" y="210">Positional servo</text>
    </g>
    <g fill="#a5d9ef" font-size="15" text-anchor="middle">
      <text x="175" y="241">Angle slider + presets</text><text x="580" y="241">Zephyr + BLE servo application</text><text x="1000" y="241">0-180 degree commands</text>
    </g>
    <g stroke="url(#accent)" stroke-width="3" fill="none">
      <path d="M296 215H405m-9-7 9 7-9 7M758 215H864m-9-7 9 7-9 7"/>
    </g>
    <text x="350" y="198" fill="#67e8f9" font-size="13" text-anchor="middle">Bluetooth LE</text>
    <text x="812" y="198" fill="#86efac" font-size="13" text-anchor="middle">PWM pin</text>
    <g fill="#132a43" stroke="#31516d">
      <rect x="44" y="300" width="352" height="232" rx="18"/><rect x="424" y="300" width="352" height="232" rx="18"/><rect x="804" y="300" width="352" height="232" rx="18"/>
    </g>
    <g fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M161 418H279M220 416V387L183 355M220 387L257 355M183 355L163 369M257 355L277 369"/>
      <rect x="543" y="353" width="102" height="56" rx="9"/><path d="M645 369L670 357V406L645 394M594 410V427M566 429H622"/>
      <rect x="911" y="345" width="139" height="85" rx="8"/><path d="M927 363H1034M927 387H1034M927 411H1034"/>
    </g>
    <g fill="#f8fafc" font-size="23" font-weight="700" text-anchor="middle">
      <text x="220" y="469">Robotic gripper</text><text x="600" y="469">Camera pan mount</text><text x="980" y="469">Adjustable air vent</text>
    </g>
    <g fill="#b9cddd" font-size="16" text-anchor="middle">
      <text x="220" y="500">Set a jaw or linkage position</text><text x="600" y="500">Adjust the viewing direction</text><text x="980" y="500">Set the louver opening</text>
    </g>
    <g fill="#132a43" stroke="#31516d">
      <rect x="44" y="556" width="352" height="232" rx="18"/><rect x="424" y="556" width="352" height="232" rx="18"/><rect x="804" y="556" width="352" height="232" rx="18"/>
    </g>
    <g fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="220" cy="642" r="43"/><path d="M179 642H261M220 642V683M208 616L220 604L232 616"/>
      <path d="M538 606V687M558 606V687M638 606L558 687M660 606L580 687M538 623H558M538 666H558M611 637L630 653"/>
      <path d="M913 609H1047V682H913ZM980 610V681M980 646L1020 621M930 627H947M930 646H947M930 665H947"/>
    </g>
    <g fill="#f8fafc" font-size="23" font-weight="700" text-anchor="middle">
      <text x="220" y="725">Model vehicle steering</text><text x="600" y="725">Model railway turnout</text><text x="980" y="725">Tabletop sorting gate</text>
    </g>
    <g fill="#b9cddd" font-size="16" text-anchor="middle">
      <text x="220" y="756">Set a steering linkage angle</text><text x="600" y="756">Position a track-switch linkage</text><text x="980" y="756">Direct items with a diverter flap</text>
    </g>
    <rect x="44" y="813" width="1112" height="46" rx="12" fill="#244761"/>
    <text x="600" y="843" fill="#86efac" font-size="20" font-weight="700" text-anchor="middle">ANY WHOLE-DEGREE ANGLE 0-180  |  PRESETS 0 / 90 / 180  |  50 Hz PWM</text>
    <text x="44" y="889" fill="#a6bdce" font-size="14">Potential integrations only. Mechanics, power, calibration and safety controls must be designed for the end product.</text>
  </g>
</svg>
